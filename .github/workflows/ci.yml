name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Verify generated browser bundle
        run: npm run check:browser
      - name: Contract and browser-bundle tests
        run: npm test
      - name: Syntax-check static scripts
        run: node --check js/data-products-browser.js && node --check scripts/verify-browser-consumers.mjs
